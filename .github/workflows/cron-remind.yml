name: "Cron: Wednesday reminder emails"

on:
  schedule:
    # DST-safe pair: the API accepts only the run that reaches Lisbon at 19:00.
    # UTC+0 (winter): 19:00 UTC = 19:00 WET
    # UTC+1 (summer): 18:00 UTC = 19:00 WEST
    - cron: "0 18 * * 3"
    - cron: "0 19 * * 3"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/remind
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # No -f here on purpose: with --fail curl aborts before writing the
          # body, so a 500 shows up in the log as "curl: (22)" with no reason.
          # The explicit HTTP_CODE check below fails the job instead.
          RESPONSE=$(curl -sSL -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/remind")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Remind endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
