name: "Cron: Wednesday reminder emails"

on:
  schedule:
    # Lisbon is UTC+0 in winter and UTC+1 in summer.  Fire both adjacent
    # UTC hours; the API guard accepts only Wednesday 19:00 Lisbon.
    - cron: "0 18 * * 3"
    - cron: "0 19 * * 3"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/remind
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl -sSfL -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/remind")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Remind endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
