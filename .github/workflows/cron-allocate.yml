name: "Cron: Friday allocation emails"

on:
  schedule:
    # Single schedule at 07:00 UTC.
    # Winter (WET = UTC+0): 07:00 local. Summer (WEST = UTC+1): 08:00 local.
    # GitHub Actions has started this job 5–12 hours late. The API accepts
    # any Friday from 06:00 Lisbon onward so a late start still allocates.
    # The Monday-row idempotency check prevents a second run that day.
    - cron: "0 7 * * 5"
  workflow_dispatch: {}

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/allocate
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # No -f here on purpose: with --fail curl aborts before writing the
          # body, so a 500 shows up in the log as "curl: (22)" with no reason.
          # The explicit HTTP_CODE check below fails the job instead.
          RESPONSE=$(curl -sSL -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/allocate")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Allocate endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
