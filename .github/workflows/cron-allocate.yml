name: "Cron: Friday allocation emails"

on:
  schedule:
    # Lisbon is UTC+0 in winter and UTC+1 in summer.  Fire both adjacent
    # UTC hours; the API guard rejects runs before Friday 08:00 Lisbon.
    - cron: "0 7 * * 5"
    - cron: "0 8 * * 5"
  workflow_dispatch: {}

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/allocate
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl -sSfL -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/allocate")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Allocate endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
